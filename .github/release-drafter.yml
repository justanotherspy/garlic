# Configuration for release-drafter
# https://github.com/release-drafter/release-drafter

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Categories based on PR labels
categories:
  # Version bump PRs stay out of the release notes
  # (was the deprecated `exclude-labels` block).
  - type: 'pre-exclude'
    when:
      labels:
        - 'skip-changelog'
        - 'release'

  - title: 'Features'
    when:
      labels:
        - 'feature'
        - 'enhancement'
  - title: 'Bug Fixes'
    when:
      labels:
        - 'fix'
        - 'bugfix'
        - 'bug'
  - title: 'Documentation'
    when:
      labels:
        - 'documentation'
        - 'docs'
  - title: 'Maintenance'
    when:
      labels:
        - 'chore'
        - 'dependencies'
        - 'ci'

  # Version resolution (was the deprecated `version-resolver` block).
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      labels:
        - 'major'
        - 'breaking'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      labels:
        - 'minor'
        - 'feature'
        - 'enhancement'
  - type: 'version-resolver'
    semver-increment: 'patch'
    when:
      labels:
        - 'patch'
        - 'fix'
        - 'bugfix'
        - 'bug'
        - 'chore'
        - 'documentation'
  # No `when` condition: the default increment (was `version-resolver.default`).
  - type: 'version-resolver'
    semver-increment: 'patch'

# Also categorize by conventional commit prefixes in PR titles
autolabeler:
  - label: 'feature'
    title:
      - '/^feat(\(.+\))?:/i'
  - label: 'fix'
    title:
      - '/^fix(\(.+\))?:/i'
  - label: 'documentation'
    title:
      - '/^docs(\(.+\))?:/i'
  - label: 'chore'
    title:
      - '/^chore(\(.+\))?:/i'
      - '/^ci(\(.+\))?:/i'
      - '/^refactor(\(.+\))?:/i'
      - '/^test(\(.+\))?:/i'
      - '/^style(\(.+\))?:/i'

# Template for release notes
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
