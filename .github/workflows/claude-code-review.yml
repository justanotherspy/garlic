name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - '**/*.md'
      - '.mcp.json'
      - '.gitignore'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - 'uv.lock'
      - 'cliff.toml'
      - '.github/**/*'

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip dependabot PRs and skip draft PRs on 'opened' event (review runs when marked ready)
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !(github.event.action == 'opened' && github.event.pull_request.draft)

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@4e5d8b13ca281a6d163cdb287d8917b216e00d6f # v1.0.103
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
            TITLE: ${{ github.event.pull_request.title }}

            Review this PR. The branch is already checked out.

            1. Fetch PR data once: `gh pr view ${{ github.event.pull_request.number }} --json title,body,files,commits,additions,deletions,author,isDraft`
            2. Fetch the diff once: `gh pr diff ${{ github.event.pull_request.number }}`
            3. Read the root `CLAUDE.md`.

            Focus on, in priority order:
              (a) Genuine bugs in the diff (not pre-existing, not stylistic)
              (b) Security issues introduced or supply chain has external runtime dependencies
              (c) Tests in `tests/` use the `garlic_env` fixture when they touch state/config and cover any new code in 'src/' in the diff
              (d) Conventional Commits compliance on all commit messages
              (e) PR title starts with the Linear issue ID (JUS-XX) and has a link to the ticket in the Body
              (f) README updated if user-facing behaviour changed

            Skip bug-hunting on changes that are obviously safe:
              - Pure additions of config files (`.mcp.json`, `.github/**`, `pyproject.toml` non-runtime sections)
              - Pure documentation changes with no changes to code alongside it
              - Single-line value derivations, test-only additions

            If you find nothing of note do not leave a comment its not necessary.
            Do not spawn subagents unless the diff is over 300 lines of source code and you have a clear reason for a subagent
            When you do have a review comment make it concise and only list issues you see that are noteworthy.
            Only post via `mcp__github_inline_comment__create_inline_comment`.
          claude_args: |
            --max-turns 10
            --model claude-sonnet-4-6
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git blame:*),Bash(cat:*),Bash(ls:*)"
          display_report: true
          show_full_output: true

      - name: Upload Claude execution output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-execution-output
          path: ${{ steps.claude-review.outputs.execution_file || '/home/runner/work/_temp/claude-execution-output.json' }}
          if-no-files-found: warn

