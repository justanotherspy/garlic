name: Claude Code Review

on:
  pull_request:
    types: [ready_for_review, labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Run when:
    #   - label "claude-review" is added to a non-draft PR, OR
    #   - PR is marked ready and already has the "claude-review" label
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !github.event.pull_request.draft &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'claude-review') ||
        (github.event.action == 'ready_for_review' && contains(github.event.pull_request.labels.*.name, 'claude-review'))
      )

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@5ef2e550a465a721f4f45e4a7d3c340c873e1dcc # v1.0.190
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
            TITLE: ${{ github.event.pull_request.title }}

            Review this PR. The branch is already checked out.

            IMPORTANT: This review runs after a PR is marked ready for review. Per CLAUDE.md, PRs are correctly opened as drafts, then the maintainer marks them ready to trigger this review. The PR being non-draft at review time is expected workflow — do not flag this as an issue.

            1. Fetch PR data once: `gh pr view ${{ github.event.pull_request.number }} --json title,body,files,commits,additions,deletions,author,isDraft`
            2. Fetch the diff once: `gh pr diff ${{ github.event.pull_request.number }}`
            3. Read the root `CLAUDE.md`.

            Focus on, in priority order:
              (a) Genuine bugs in the diff (not pre-existing, not stylistic)
              (b) Security issues introduced, or new runtime dependencies added to `Cargo.toml` without clear justification (garlic keeps its dependency surface minimal and audited; `Cargo.lock` must be committed)
              (c) Tests isolate filesystem I/O via a temp `GARLIC_DIR`/`CLAUDE_HOME` (never the real `~/.garlic` or `~/.claude`) and cover any new code in `src/` in the diff; `cargo fmt --check` and `cargo clippy -D warnings` stay clean
              (d) Conventional Commits compliance on all commit messages
              (e) PR title starts with the Linear issue ID (JUS-XX) and has a link to the ticket in the Body
              (f) README updated if user-facing behaviour changed

            Skip bug-hunting on changes that are obviously safe:
              - Pure additions of config files (`.mcp.json`, `.github/**`, `Cargo.toml` non-dependency sections)
              - Pure documentation changes with no changes to code alongside it
              - Single-line value derivations, test-only additions

            If you find nothing of note do not leave a comment its not necessary.
            Do not spawn subagents unless the diff is over 300 lines of source code and you have a clear reason for a subagent
            When you do have a review comment make it concise and only list issues you see that are noteworthy.
            Only post via `mcp__github_inline_comment__create_inline_comment`.
          claude_args: |
            --max-turns 10
            --model claude-sonnet-4-6
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git blame:*),Bash(cat:*),Bash(ls:*)"
          display_report: false
          show_full_output: false

      - name: Upload Claude execution output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-execution-output
          path: ${{ steps.claude-review.outputs.execution_file || '/home/runner/work/_temp/claude-execution-output.json' }}
          if-no-files-found: warn

      - name: Post cost comment
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const execFile = process.env.EXECUTION_FILE;
            if (!execFile || !fs.existsSync(execFile)) {
              core.info('No execution file found, skipping cost comment');
              return;
            }
            const log = JSON.parse(fs.readFileSync(execFile, 'utf8'));
            const result = log.find(m => m.type === 'result');
            if (!result) {
              core.info('No result message in execution log');
              return;
            }
            const cost = result.total_cost_usd?.toFixed(4) ?? 'unknown';
            const usage = result.usage ?? {};
            const inp = (usage.input_tokens ?? 0).toLocaleString();
            const out = (usage.output_tokens ?? 0).toLocaleString();
            const cacheRead = (usage.cache_read_input_tokens ?? 0).toLocaleString();
            const cacheWrite = (usage.cache_creation_input_tokens ?? 0).toLocaleString();
            const body = [
              `🤖 **Claude review cost: $${cost}**`,
              '',
              '| | Tokens |',
              '|---|---|',
              `| Input | ${inp} |`,
              `| Output | ${out} |`,
              `| Cache read | ${cacheRead} |`,
              `| Cache write | ${cacheWrite} |`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
