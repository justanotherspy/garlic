name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify tag matches package version
        id: check
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package version ($PKG_VERSION)"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Run tests
        run: cargo test

  upload-binaries:
    name: Upload ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [verify, test]
    permissions:
      contents: write # upload assets to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build and upload binary
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: garlic
          target: ${{ matrix.target }}
          archive: garlic-$target
          tar: unix
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io and Homebrew tap
    runs-on: ubuntu-latest
    # Also needs upload-binaries: the Homebrew steps below download the released
    # macOS binaries to compute their checksums for the cask.
    needs: [verify, test, upload-binaries]
    environment:
      name: crates-io
      url: https://crates.io/crates/garlic-ward
    permissions:
      contents: read
      # Trusted Publishing: mint a short-lived crates.io token via OIDC.
      # Configure Trusted Publishing for `garlic-ward` on crates.io, OR remove
      # the auth-action step below and set a CARGO_REGISTRY_TOKEN secret.
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Authenticate to crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # Homebrew tap publishing runs here (rather than in a standalone job) so it
      # can read HOMEBREW_TAP_GITHUB_TOKEN, an environment secret on crates-io.
      - name: Render cask from the released macOS binaries
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          tmp="$(mktemp -d)"
          curl -fsSL --retry 5 --retry-all-errors -o "$tmp/arm.tar.gz"   "$base/garlic-aarch64-apple-darwin.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$tmp/intel.tar.gz" "$base/garlic-x86_64-apple-darwin.tar.gz"
          arm_sha="$(sha256sum "$tmp/arm.tar.gz"   | cut -d' ' -f1)"
          intel_sha="$(sha256sum "$tmp/intel.tar.gz" | cut -d' ' -f1)"
          mkdir -p out
          sed \
            -e "s/@@VERSION@@/${VERSION}/" \
            -e "s/@@ARM_SHA@@/${arm_sha}/" \
            -e "s/@@INTEL_SHA@@/${intel_sha}/" \
            .github/homebrew/garlic-cask.rb.tmpl > out/garlic.rb
          echo "Generated cask:"
          cat out/garlic.rb

      - name: Check out the Homebrew tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: justanotherspy/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Commit and push the cask
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cp out/garlic.rb homebrew-tap/Casks/garlic.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Casks/garlic.rb; then
            echo "Cask already up to date; nothing to push."
            exit 0
          fi
          git add Casks/garlic.rb
          git commit -m "chore(cask): garlic ${TAG}"
          git push

  promote:
    name: Promote release to latest
    runs-on: ubuntu-latest
    # Run only after the binaries are attached and the cask is published, so the
    # "Latest" badge never points at a half-published release. Publish the
    # drafted release as a pre-release; this step flips it to the full release.
    needs: [upload-binaries, publish]
    permissions:
      contents: write
    steps:
      - name: Mark release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease=false \
            --latest
