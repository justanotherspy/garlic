version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      rust:
        patterns:
          - "*"
