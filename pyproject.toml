[project]
name = "garlic-cli"
version = "0.1.1"
description = "Track active coding time with Claude Code and nudge yourself to take breaks"
requires-python = ">=3.11"
dependencies = []
authors = [{name = "Daniel Schwartz", email = "danielschwar@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
classifiers = [
    "Environment :: Console",
    "Topic :: Software Development",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
garlic = "garlic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garlic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "build>=1.4.0",
    "pytest>=8.0",
    "twine>=6.2.0",
]
