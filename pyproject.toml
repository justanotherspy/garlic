[project]
name = "garlic"
version = "0.1.0"
description = "Track active coding time with Claude Code and nudge yourself to take breaks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
garlic = "garlic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garlic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0"]
